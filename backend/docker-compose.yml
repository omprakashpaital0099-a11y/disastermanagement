services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: prithvinet
      POSTGRES_USER: prithvinet
      POSTGRES_PASSWORD: prithvinet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
